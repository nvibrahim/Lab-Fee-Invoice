<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Invoice Dashboard — MedLab</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#0f0e0c;
  --ink-mid:#6b6560;
  --ink-soft:#a8a29b;
  --bg:#f5f2ed;
  --bg2:#eceae5;
  --white:#ffffff;
  --gold:#c49a3c;
  --gold-light:#e0b84a;
  --gold-pale:#fdf8ec;
  --green:#1e6b45;
  --green-bg:#e8f5ee;
  --red:#8b2020;
  --red-bg:#fdeaea;
  --border:#ddd8cf;
  --radius:10px;
  --shadow:0 4px 24px rgba(15,14,12,0.10);

  /* Table grid — 6 columns. Override breakpoint below for mobile. */
  --cols: 120px 1fr 1fr 108px 110px 42px;
}

html,body{min-height:100%;font-family:'Lato',sans-serif;background:var(--bg);color:var(--ink);}

/* ── LOADER ─────────────────────────────────────────────────── */
#loader{
  position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:999;transition:opacity 0.5s;
}
#loader.hidden{opacity:0;pointer-events:none;}
.loader-logo{font-family:'Playfair Display',serif;font-size:28px;color:var(--gold-light);margin-bottom:32px;letter-spacing:0.04em;}
.loader-logo span{display:block;font-family:'Lato',sans-serif;font-size:11px;color:#6b6560;font-weight:300;letter-spacing:0.12em;margin-top:4px;text-transform:uppercase;}
.loader-bar{width:220px;height:2px;background:#2a2825;border-radius:2px;overflow:hidden;}
.loader-fill{height:100%;background:var(--gold);border-radius:2px;animation:barfill 1.6s ease forwards;}
@keyframes barfill{from{width:0}to{width:100%}}
.loader-msg{font-size:12px;color:#6b6560;margin-top:16px;letter-spacing:0.06em;}

/* ── ERROR STATE ─────────────────────────────────────────────── */
#errState{
  display:none;position:fixed;inset:0;background:var(--bg);
  align-items:center;justify-content:center;flex-direction:column;
  gap:14px;text-align:center;padding:32px;
}
#errState.show{display:flex;}

/* ── TOPBAR ──────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--ink);padding:0 28px;height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.topbar-brand{
  font-family:'Playfair Display',serif;font-size:17px;
  color:var(--gold-light);letter-spacing:0.03em;white-space:nowrap;
}
.topbar-brand span{
  display:block;font-family:'Lato',sans-serif;font-size:10px;
  color:#6b6560;font-weight:300;letter-spacing:0.1em;margin-top:1px;
}
.stat-chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.chip{
  font-size:11px;font-weight:700;letter-spacing:0.06em;
  padding:4px 12px;border-radius:20px;white-space:nowrap;cursor:pointer;transition:opacity 0.15s;
}
.chip:hover{opacity:0.8;}
.chip-total   {background:rgba(255,255,255,0.1);color:#ccc;}
.chip-pending {background:rgba(196,154,60,0.22);color:var(--gold-light);}
.chip-approved{background:rgba(30,107,69,0.30);color:#6fcfa0;}
.chip-rejected{background:rgba(139,32,32,0.30);color:#e08080;}
.topbar-actions{display:flex;gap:8px;}
.topbar-btn{
  font-size:11px;font-weight:700;letter-spacing:0.05em;
  padding:6px 14px;border-radius:6px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.15);background:transparent;
  color:#aaa;font-family:'Lato',sans-serif;transition:all 0.15s;
}
.topbar-btn:hover{background:rgba(255,255,255,0.08);color:var(--gold-light);}

/* ── MAIN ────────────────────────────────────────────────────── */
.main{max-width:1160px;margin:0 auto;padding:24px 20px;}

/* ── FILTER BAR ──────────────────────────────────────────────── */
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.ftab{
  padding:7px 18px;border-radius:20px;font-size:12px;font-weight:700;
  cursor:pointer;border:1.5px solid var(--border);background:var(--white);
  color:var(--ink-mid);letter-spacing:0.04em;transition:all 0.14s;
  font-family:'Lato',sans-serif;
}
.ftab.active{background:var(--ink);color:var(--gold-light);border-color:var(--ink);}
.ftab:hover:not(.active){background:var(--bg2);}
.search-wrap{flex:1;min-width:170px;position:relative;}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none;}
.search-input{
  width:100%;padding:8px 14px 8px 34px;border-radius:20px;
  border:1.5px solid var(--border);background:var(--white);
  font-family:'Lato',sans-serif;font-size:13px;color:var(--ink);
  outline:none;transition:border 0.2s;
}
.search-input:focus{border-color:var(--gold);}

/* ── TABLE SHELL ─────────────────────────────────────────────── */
.tbl-wrap{
  background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);
}

/* ── TABLE HEADER ────────────────────────────────────────────── */
.tbl-head{
  display:grid;grid-template-columns:var(--cols);
  padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--border);
  gap:12px;
}
.th{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);}

/* ── INVOICE ROW ─────────────────────────────────────────────── */
.row-wrap{border-bottom:1px solid var(--border);}
.row-wrap:last-child{border-bottom:none;}

.inv-row{
  display:grid;grid-template-columns:var(--cols);gap:12px;
  padding:13px 18px;cursor:pointer;transition:background 0.12s;
  align-items:center;
}
.inv-row:hover{background:var(--bg);}
.inv-row.open{background:var(--gold-pale);}

.cell{font-size:13px;color:var(--ink);overflow:hidden;min-width:0;}
.cell-main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-mono{font-family:'Lato',monospace;font-size:12px;font-weight:600;}

/* ── BADGES ──────────────────────────────────────────────────── */
.badge{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.05em;
  text-transform:uppercase;padding:3px 9px;border-radius:20px;
}
.badge-pending {background:rgba(196,154,60,0.15);color:#9a7620;}
.badge-approved{background:var(--green-bg);color:var(--green);}
.badge-rejected{background:var(--red-bg);color:var(--red);}

/* ── CHEVRON ─────────────────────────────────────────────────── */
.chevron{font-size:16px;color:var(--ink-soft);transition:transform 0.22s;justify-self:center;}
.chevron.open{transform:rotate(180deg);}

/* ── DETAIL PANEL ────────────────────────────────────────────── */
.detail-panel{
  display:none;border-top:1px solid var(--border);
  background:var(--gold-pale);padding:20px 20px 24px;
}
.detail-panel.open{display:block;}

/* PDF row */
.pdf-row{
  display:flex;align-items:center;gap:10px;
  background:var(--white);border:1px solid var(--border);border-radius:8px;
  padding:11px 16px;margin-bottom:16px;
}
.pdf-icon-lg{font-size:20px;}
.pdf-label{flex:1;font-size:13px;font-weight:500;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.pdf-label-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.view-pdf-link{
  font-size:12px;font-weight:700;color:var(--gold);
  border:1.5px solid var(--gold);border-radius:6px;
  padding:6px 14px;text-decoration:none;white-space:nowrap;
  transition:all 0.15s;
}
.view-pdf-link:hover{background:var(--gold-pale);}

/* Two-column inner grid */
.inner-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* Edit card */
.edit-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:8px;padding:16px;
}
.card-title{
  font-size:10px;font-weight:700;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;
}
.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.field-group{display:flex;flex-direction:column;gap:4px;}
.field-label{font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--ink-mid);text-transform:uppercase;}
.field-input{
  width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:6px;
  font-family:'Lato',sans-serif;font-size:13px;color:var(--ink);background:var(--bg);
  outline:none;transition:border 0.18s;
}
.field-input:focus{border-color:var(--gold);background:var(--white);}
textarea.field-input{resize:none;height:64px;line-height:1.5;grid-column:1/-1;}

.save-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
.save-msg{font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;display:none;animation:fadein 0.3s;}
.save-msg.ok{color:var(--green);background:var(--green-bg);}
.save-msg.err{color:var(--red);background:var(--red-bg);}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

/* Decision card */
.decision-body{font-size:13px;color:var(--ink-mid);line-height:1.6;margin-bottom:14px;}
.decided-box{
  padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.55;
}
.decided-box.approved{background:var(--green-bg);color:var(--green);border:1px solid #b2dcc3;}
.decided-box.rejected{background:var(--red-bg);color:var(--red);border:1px solid #f5c0c0;}
.decided-box strong{display:block;font-weight:700;margin-bottom:3px;}

/* Buttons */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{
  padding:10px 20px;border-radius:7px;font-family:'Lato',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;border:none;
  transition:all 0.16s;letter-spacing:0.04em;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-save   {background:var(--gold);color:var(--ink);}
.btn-save:hover{background:var(--gold-light);transform:translateY(-1px);}
.btn-approve{background:var(--green);color:white;}
.btn-approve:hover{background:#155235;transform:translateY(-1px);box-shadow:0 3px 10px rgba(30,107,69,0.3);}
.btn-reject {background:var(--white);color:var(--red);border:1.5px solid var(--red);}
.btn-reject:hover{background:var(--red-bg);}
.btn-ghost  {background:var(--bg2);color:var(--ink-mid);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--border);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none !important;box-shadow:none !important;}

/* ── EMPTY / LOADING STATES ──────────────────────────────────── */
.empty-state{
  padding:60px 20px;text-align:center;color:var(--ink-soft);
}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-txt {font-size:14px;line-height:1.7;}

.shimmer-row{
  display:grid;grid-template-columns:var(--cols);gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--border);align-items:center;
}
.shimmer-cell{
  height:14px;border-radius:4px;
  background:linear-gradient(90deg,var(--bg2) 25%,var(--bg) 50%,var(--bg2) 75%);
  background-size:400% 100%;animation:shimmer 1.4s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── SPINNER ─────────────────────────────────────────────────── */
.spin{
  width:14px;height:14px;border:2px solid rgba(0,0,0,0.15);
  border-top-color:currentColor;border-radius:50%;
  animation:rotate 0.65s linear infinite;
}
@keyframes rotate{to{transform:rotate(360deg)}}

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media(max-width:820px){
  :root{--cols:110px 1fr 100px 42px;}
  .col-subject,.col-date{display:none;}
  .stat-chips{display:none;}
}
@media(max-width:520px){
  :root{--cols:1fr 90px 38px;}
  .col-invnum{display:none;}
  .inner-grid{grid-template-columns:1fr;}
  .field-pair{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-logo">MedLab<span>Invoice Portal</span></div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div class="loader-msg">Loading invoices…</div>
</div>

<!-- ERROR -->
<div id="errState">
  <div style="font-size:48px;">⚠️</div>
  <div style="font-family:'Playfair Display',serif;font-size:22px;">Could Not Load</div>
  <div style="font-size:14px;color:var(--ink-mid);max-width:420px;line-height:1.6;" id="errMsg"></div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">MedLab<span>Invoice Dashboard</span></div>
  <div class="stat-chips">
    <span class="chip chip-total"    id="cTotal"   >— Total</span>
    <span class="chip chip-pending"  id="cPending" >— Pending</span>
    <span class="chip chip-approved" id="cApproved">— Approved</span>
    <span class="chip chip-rejected" id="cRejected">— Rejected</span>
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" onclick="refreshData()">↻ Refresh</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main" id="mainArea" style="display:none;">

  <!-- Filter bar -->
  <div class="filter-bar">
    <button class="ftab active" data-f="all"      onclick="setFilter('all')">All</button>
    <button class="ftab"        data-f="pending"   onclick="setFilter('pending')">Pending</button>
    <button class="ftab"        data-f="approved"  onclick="setFilter('approved')">Approved</button>
    <button class="ftab"        data-f="rejected"  onclick="setFilter('rejected')">Rejected</button>
    <div class="search-wrap">
      <input class="search-input" id="searchQ" type="text"
        placeholder="Search invoice, name, amount…" oninput="renderTable()"/>
    </div>
  </div>

  <!-- Invoice table -->
  <div class="tbl-wrap" id="tblWrap"></div>

</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbymAkCgDoz7NtFlgrAt0eg7rY_7su6a7jAx3A-80wv4dd9UGwI6_Q2oHaYCajdysAYVuw/exec';
// ─────────────────────────────────────────────────────────────

const params      = new URLSearchParams(window.location.search);
const SHEET_ID    = params.get('sheet');
const FOCUS_TOKEN = params.get('token'); // auto-expand if present in link

// Sheet column order (matches Code.gs header row)
const C = {
  TOKEN:0, MSG_ID:1, PDF_URL:2, SENDER_EMAIL:3, SENDER_NAME:4,
  SUBJECT:5, FILENAME:6, INV_NUM:7, AMOUNT:8, CLIENT_EMAIL:9,
  DATE:10, STATUS:11, COMMENT:12, DECISION_DATE:13
};

let allRows      = [];   // raw data array (each element = string[])
let activeFilter = 'all';
let openToken    = null; // which row is expanded

// ── BOOT ──────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  if (!SHEET_ID) {
    showError('No Sheet ID found in the URL.<br>Expected format: <code>approve.html?sheet=YOUR_SHEET_ID</code>');
    return;
  }
  await loadAndRender();
  if (FOCUS_TOKEN) setTimeout(() => expandRow(FOCUS_TOKEN, true), 300);
});

// ── LOAD & RENDER ─────────────────────────────────────────────
async function loadAndRender() {
  showSkeletonTable();
  try {
    await fetchSheet();
    updateStats();
    renderTable();
    document.getElementById('mainArea').style.display = 'block';
    hideLoader();
  } catch(err) {
    showError('Failed to load invoice data.<br><small style="opacity:0.7">' + esc(err.message) + '</small>');
  }
}

async function refreshData() {
  try {
    await fetchSheet();
    updateStats();
    renderTable();
  } catch(e) { /* silently ignore */ }
}

// ── FETCH SHEET DATA ──────────────────────────────────────────
async function fetchSheet() {
  const url  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Invoices&t=${Date.now()}`;
  const res  = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, ''));
  const rows = json.table?.rows || [];

  allRows = rows
    .map(row => row.c.map(c => c ? (c.v !== null ? String(c.v) : '') : ''))
    .filter(cells => cells[C.TOKEN] && cells[C.TOKEN].trim())
    .reverse(); // newest first
}

// ── STATS ─────────────────────────────────────────────────────
function updateStats() {
  const pending  = allRows.filter(r => r[C.STATUS] === 'Pending').length;
  const approved = allRows.filter(r => r[C.STATUS] === 'Approved').length;
  const rejected = allRows.filter(r => r[C.STATUS] === 'Rejected').length;
  set('cTotal',    `${allRows.length} Total`);
  set('cPending',  `${pending} Pending`);
  set('cApproved', `${approved} Approved`);
  set('cRejected', `${rejected} Rejected`);
}

// ── FILTER LOGIC ──────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.ftab').forEach(b =>
    b.classList.toggle('active', b.dataset.f === f));
  renderTable();
}

function visibleRows() {
  const q = (document.getElementById('searchQ')?.value || '').trim().toLowerCase();
  return allRows.filter(r => {
    if (activeFilter !== 'all' && r[C.STATUS].toLowerCase() !== activeFilter) return false;
    if (!q) return true;
    return [r[C.INV_NUM], r[C.SENDER_NAME], r[C.SENDER_EMAIL],
            r[C.AMOUNT],  r[C.SUBJECT],     r[C.FILENAME]]
      .some(v => v.toLowerCase().includes(q));
  });
}

// ── RENDER TABLE ──────────────────────────────────────────────
function renderTable() {
  const rows = visibleRows();
  const wrap = document.getElementById('tblWrap');
  if (!wrap) return;

  if (rows.length === 0) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-txt">No invoices match your filter</div>
      </div>`;
    return;
  }

  let html = `
    <div class="tbl-head">
      <div class="th col-invnum">Invoice #</div>
      <div class="th">From</div>
      <div class="th col-subject">Subject</div>
      <div class="th col-date">Date</div>
      <div class="th">Amount / Status</div>
      <div class="th"></div>
    </div>`;

  rows.forEach(r => {
    const tok  = r[C.TOKEN];
    const stat = r[C.STATUS] || 'Pending';
    const isOpen = openToken === tok;
    const bCls = stat === 'Approved' ? 'badge-approved'
               : stat === 'Rejected' ? 'badge-rejected' : 'badge-pending';
    const fileId  = extractFileId(r[C.PDF_URL]);
    const viewUrl = fileId ? `https://drive.google.com/file/d/${fileId}/view` : '';

    html += `
      <div class="row-wrap" id="rw-${tok}">

        <!-- Summary row (clickable) -->
        <div class="inv-row${isOpen ? ' open' : ''}" onclick="toggleRow('${tok}')">
          <div class="cell col-invnum">
            <div class="cell-main cell-mono">${esc(r[C.INV_NUM]) || '—'}</div>
          </div>
          <div class="cell">
            <div class="cell-main">${esc(r[C.SENDER_NAME] || r[C.SENDER_EMAIL] || '—')}</div>
            <div class="cell-sub">${esc(r[C.SENDER_EMAIL])}</div>
          </div>
          <div class="cell col-subject">
            <div class="cell-main" title="${esc(r[C.SUBJECT])}">${esc(trunc(r[C.SUBJECT], 50))}</div>
            <div class="cell-sub">${esc(r[C.FILENAME])}</div>
          </div>
          <div class="cell col-date">
            <div class="cell-main">${fmtDate(r[C.DATE])}</div>
          </div>
          <div class="cell">
            <div class="cell-main">${esc(r[C.AMOUNT] || '—')}</div>
            <div style="margin-top:4px;"><span class="badge ${bCls}">${stat}</span></div>
          </div>
          <div class="cell">
            <div class="chevron${isOpen ? ' open' : ''}">▾</div>
          </div>
        </div>

        <!-- Expandable detail panel -->
        <div class="detail-panel${isOpen ? ' open' : ''}" id="dp-${tok}">

          <!-- PDF info row -->
          <div class="pdf-row">
            <div class="pdf-icon-lg">📄</div>
            <div style="flex:1;min-width:0;">
              <div class="pdf-label">${esc(r[C.FILENAME] || 'invoice.pdf')}</div>
              <div class="pdf-label-sub">${esc(r[C.SUBJECT])}</div>
            </div>
            ${viewUrl
              ? `<a href="${viewUrl}" target="_blank" class="view-pdf-link">View PDF ↗</a>`
              : `<span style="font-size:12px;color:var(--ink-soft);">No PDF</span>`}
          </div>

          <div class="inner-grid">

            <!-- LEFT: Edit fields -->
            <div class="edit-card">
              <div class="card-title">Edit Invoice Details</div>

              <div class="field-pair">
                <div class="field-group">
                  <label class="field-label">Invoice Number</label>
                  <input class="field-input" id="f-inv-${tok}"
                    value="${esc(r[C.INV_NUM])}" placeholder="e.g. INV-1001"/>
                </div>
                <div class="field-group">
                  <label class="field-label">Amount</label>
                  <input class="field-input" id="f-amt-${tok}"
                    value="${esc(r[C.AMOUNT])}" placeholder="e.g. ₹5,000"/>
                </div>
              </div>

              <div class="field-pair">
                <div class="field-group" style="grid-column:1/-1;">
                  <label class="field-label">Comment / Notes</label>
                  <textarea class="field-input" id="f-cmt-${tok}"
                    placeholder="Add a note, query, or reason…">${esc(r[C.COMMENT])}</textarea>
                </div>
              </div>

              <div class="save-row">
                <button class="btn btn-save" id="savebtn-${tok}"
                  onclick="saveEdits('${tok}')">💾 Save Changes</button>
                <span class="save-msg" id="savemsg-${tok}"></span>
              </div>
            </div>

            <!-- RIGHT: Decision -->
            <div class="edit-card">
              <div class="card-title">Decision</div>

              ${stat === 'Pending' ? `
                <div class="decision-body">
                  Review the PDF above, edit any field details, then approve or reject.
                </div>
                <div class="btn-row">
                  <button class="btn btn-reject"  id="rejbtn-${tok}"
                    onclick="decide('${tok}','Rejected')">✕ Reject</button>
                  <button class="btn btn-approve" id="appbtn-${tok}"
                    onclick="decide('${tok}','Approved')">✓ Approve</button>
                </div>` : `
                <div class="decided-box ${stat.toLowerCase()}">
                  <strong>${stat === 'Approved' ? '✅ Approved' : '❌ Rejected'}</strong>
                  ${r[C.DECISION_DATE] ? `On ${fmtDate(r[C.DECISION_DATE])}` : ''}
                  ${r[C.COMMENT] ? `<div style="margin-top:6px;font-style:italic;opacity:0.85;">"${esc(r[C.COMMENT])}"</div>` : ''}
                </div>
                <div style="margin-top:12px;">
                  <button class="btn btn-ghost" style="font-size:11px;padding:8px 14px;"
                    onclick="resetToPending('${tok}')">↩ Reset to Pending</button>
                </div>`}

              <!-- Client info (read-only) -->
              <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
                <div class="card-title" style="margin-bottom:8px;">Client Info</div>
                <div style="font-size:12px;color:var(--ink-mid);line-height:1.8;">
                  <div>📧 ${esc(r[C.CLIENT_EMAIL] || r[C.SENDER_EMAIL] || '—')}</div>
                  <div>👤 ${esc(r[C.SENDER_NAME] || '—')}</div>
                  <div>📅 Received: ${fmtDate(r[C.DATE])}</div>
                </div>
              </div>
            </div>

          </div><!-- /inner-grid -->
        </div><!-- /detail-panel -->
      </div><!-- /row-wrap -->`;
  });

  wrap.innerHTML = html;
}

// ── ROW EXPAND / COLLAPSE ─────────────────────────────────────
function toggleRow(tok) {
  openToken = (openToken === tok) ? null : tok;
  renderTable();
  if (openToken) scrollToRow(openToken);
}

function expandRow(tok, scroll) {
  openToken = tok;
  renderTable();
  if (scroll) scrollToRow(tok);
}

function scrollToRow(tok) {
  const el = document.getElementById('rw-' + tok);
  if (el) setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'nearest'}), 60);
}

// ── SAVE EDITS ────────────────────────────────────────────────
async function saveEdits(tok) {
  const invNum  = (document.getElementById('f-inv-' + tok)?.value || '').trim();
  const amount  = (document.getElementById('f-amt-' + tok)?.value || '').trim();
  const comment = (document.getElementById('f-cmt-' + tok)?.value || '').trim();
  const btn     = document.getElementById('savebtn-' + tok);

  setBtnLoading(btn, '💾 Save Changes');

  try {
    await fetch(WEBAPP_URL, {
      method : 'POST',
      mode   : 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body   : JSON.stringify({ action:'edit', token:tok, invoiceNumber:invNum, amount, comment })
    });
    // Update local cache for instant UI feedback
    const row = allRows.find(r => r[C.TOKEN] === tok);
    if (row) { row[C.INV_NUM] = invNum; row[C.AMOUNT] = amount; row[C.COMMENT] = comment; }
    showSaveMsg(tok, 'ok', '✓ Saved');
  } catch(e) {
    showSaveMsg(tok, 'err', '✗ Error — try again');
  } finally {
    setBtnDone(btn, '💾 Save Changes');
  }
}

// ── APPROVE / REJECT ──────────────────────────────────────────
async function decide(tok, decision) {
  const comment = (document.getElementById('f-cmt-' + tok)?.value || '').trim();
  const appBtn  = document.getElementById('appbtn-' + tok);
  const rejBtn  = document.getElementById('rejbtn-' + tok);

  if (appBtn) appBtn.disabled = true;
  if (rejBtn) rejBtn.disabled = true;
  if (decision === 'Approved' && appBtn) appBtn.innerHTML = '<div class="spin"></div>';
  if (decision === 'Rejected' && rejBtn) rejBtn.innerHTML = '<div class="spin"></div>';

  try {
    await fetch(WEBAPP_URL, {
      method : 'POST',
      mode   : 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body   : JSON.stringify({ token:tok, status:decision, comment })
    });
    const row = allRows.find(r => r[C.TOKEN] === tok);
    if (row) {
      row[C.STATUS]        = decision;
      row[C.COMMENT]       = comment;
      row[C.DECISION_DATE] = new Date().toISOString();
    }
    updateStats();
    renderTable();
    setTimeout(() => expandRow(tok), 40);
  } catch(e) {
    if (appBtn) { appBtn.disabled = false; appBtn.innerHTML = '✓ Approve'; }
    if (rejBtn) { rejBtn.disabled = false; rejBtn.innerHTML = '✕ Reject'; }
    alert('Something went wrong — please try again.');
  }
}

// ── RESET TO PENDING ──────────────────────────────────────────
async function resetToPending(tok) {
  if (!confirm('Reset this invoice back to Pending?')) return;
  try {
    await fetch(WEBAPP_URL, {
      method : 'POST',
      mode   : 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body   : JSON.stringify({ token:tok, status:'Pending', comment:'' })
    });
    const row = allRows.find(r => r[C.TOKEN] === tok);
    if (row) { row[C.STATUS] = 'Pending'; row[C.COMMENT] = ''; row[C.DECISION_DATE] = ''; }
    updateStats();
    renderTable();
    setTimeout(() => expandRow(tok), 40);
  } catch(e) {
    alert('Something went wrong — please try again.');
  }
}

// ── SKELETON LOADING TABLE ────────────────────────────────────
function showSkeletonTable() {
  const wrap = document.getElementById('tblWrap');
  if (!wrap) return;
  let html = `
    <div class="tbl-head">
      <div class="th col-invnum">Invoice #</div>
      <div class="th">From</div>
      <div class="th col-subject">Subject</div>
      <div class="th col-date">Date</div>
      <div class="th">Amount / Status</div>
      <div class="th"></div>
    </div>`;
  for (let i = 0; i < 5; i++) {
    html += `
      <div class="shimmer-row">
        <div class="shimmer-cell col-invnum" style="width:70%"></div>
        <div class="shimmer-cell" style="width:80%"></div>
        <div class="shimmer-cell col-subject" style="width:60%"></div>
        <div class="shimmer-cell col-date" style="width:65%"></div>
        <div class="shimmer-cell" style="width:55%"></div>
        <div></div>
      </div>`;
  }
  wrap.innerHTML = html;
  document.getElementById('mainArea').style.display = 'block';
}

// ── UTILITIES ─────────────────────────────────────────────────
function extractFileId(url) {
  if (!url) return null;
  const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)\//);
  return m ? m[1] : null;
}

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function trunc(s, n) {
  if (!s) return '';
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('en-IN',
      {day:'2-digit', month:'short', year:'numeric'});
  } catch { return iso; }
}

function set(id, txt) {
  const el = document.getElementById(id);
  if (el) el.textContent = txt;
}

function showSaveMsg(tok, type, text) {
  const el = document.getElementById('savemsg-' + tok);
  if (!el) return;
  el.className = 'save-msg ' + type;
  el.textContent = text;
  el.style.display = 'inline-block';
  setTimeout(() => { el.style.display = 'none'; }, 3200);
}

function setBtnLoading(btn, _original) {
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spin"></div> Saving…'; }
}

function setBtnDone(btn, label) {
  if (btn) { btn.disabled = false; btn.innerHTML = label; }
}

function hideLoader() {
  setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1400);
}

function showError(msg) {
  document.getElementById('loader').classList.add('hidden');
  document.getElementById('errMsg').innerHTML = msg;
  document.getElementById('errState').classList.add('show');
}
</script>
